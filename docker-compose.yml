version: '3.8'

services:
  backend:
    build: ./backend
    container_name: careermatrix-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    container_name: careermatrix-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend